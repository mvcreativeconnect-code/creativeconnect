<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — CreativeConnect</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230E0F12'/><text x='32' y='45' font-family='Georgia,serif' font-size='34' font-weight='700' text-anchor='middle' fill='%23E8A33D'>CC</text></svg>">
  <style>
    :root{
      --bg:#0E0F12; --surface:#16181D; --surface-2:#1D2027; --text:#F4F1EA;
      --muted:#9AA0AA; --accent:#E8A33D; --accent-ink:#1A1204; --line:#2A2E37;
      --ok:#7FB77E; --err:#E8705A; --radius:14px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5}
    a{color:var(--accent)}
    .hidden{display:none!important}
    .muted{color:var(--muted)}
    .nowrap{white-space:nowrap}
    /* buttons */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font:inherit;font-weight:600;
      padding:.55rem 1rem;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);
      color:var(--text);cursor:pointer;text-decoration:none}
    .btn:hover{border-color:var(--muted)}
    .btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
    .btn-sm{padding:.35rem .7rem;font-size:.85rem}
    .btn[disabled]{opacity:.6;cursor:not-allowed}
    /* login */
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
    .login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);
      border-radius:var(--radius);padding:2rem}
    .brand-mark{font-family:Georgia,serif;font-size:1.4rem;margin:0 0 .2rem}
    .brand-mark b{color:var(--accent)}
    .field{margin:1rem 0}
    .field label{display:block;font-weight:600;margin-bottom:.35rem;font-size:.9rem}
    .field input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);
      border-radius:10px;padding:.6rem .7rem;font:inherit}
    .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,163,61,.25)}
    .form-error{color:var(--err);min-height:1.2em;margin:.3rem 0;font-size:.9rem}
    /* app */
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;
      padding:.8rem 1.2rem;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
    .brand{font-family:Georgia,serif;font-weight:700}
    .brand b{color:var(--accent)}
    .topbar-actions{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
    .who{color:var(--muted);font-size:.85rem}
    .wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1.2rem}
    h1.page{font-family:Georgia,serif;font-size:1.5rem;margin:.2rem 0 1rem}
    /* stats */
    .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;margin-bottom:1.5rem}
    @media(min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}
    .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.2rem}
    .stat .n{font-size:1.8rem;font-weight:700}
    .stat .l{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
    .stat.accent .n{color:var(--accent)}
    /* filters + table */
    .toolbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
    .filter-chip{background:var(--surface);border:1px solid var(--line);color:var(--text);
      border-radius:999px;padding:.35rem .8rem;font-size:.85rem;cursor:pointer;text-transform:capitalize}
    .filter-chip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
    .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
    table{width:100%;border-collapse:collapse;min-width:760px}
    th,td{text-align:left;padding:.7rem .8rem;border-bottom:1px solid var(--line);vertical-align:top}
    th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
    tr:last-child td{border-bottom:0}
    .lead-name{font-weight:600}
    .lead-sub{color:var(--muted);font-size:.85rem}
    .lead-note{color:var(--muted);font-size:.82rem;margin-top:.35rem;max-width:340px}
    .status-sel{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;
      padding:.3rem .4rem;font:inherit;text-transform:capitalize}
    .btn-del{background:transparent;border:1px solid var(--line);color:var(--err);border-radius:8px;
      width:30px;height:30px;cursor:pointer}
    .btn-del:hover{border-color:var(--err)}
    /* toast */
    #toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%) translateY(200%);
      background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:10px;
      padding:.7rem 1.1rem;transition:transform .25s ease;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.4)}
    #toast.show{transform:translateX(-50%) translateY(0)}
    #toast.err{border-color:var(--err);color:var(--err)}
  </style>
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <div id="login-view" class="login-wrap hidden">
    <form class="login-card" id="login-form">
      <h1 class="brand-mark">Creative<b>Connect</b> Admin</h1>
      <p class="muted" style="margin-top:-4px">Sign in to see your booking requests.</p>
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </div>
      <p class="form-error" id="login-error"></p>
      <button class="btn btn-primary" id="login-btn" type="submit" style="width:100%">Sign in</button>
    </form>
  </div>

  <!-- ============ APP ============ -->
  <div id="app-view" class="hidden">
    <div class="topbar">
      <span class="brand">Creative<b>Connect</b> · Leads</span>
      <div class="topbar-actions">
        <span class="who" id="who"></span>
        <button class="btn btn-sm" id="refresh-btn">Refresh</button>
        <a class="btn btn-sm" href="../index.html" target="_blank" rel="noopener">View site ↗</a>
        <button class="btn btn-sm" id="logout-btn">Log out</button>
      </div>
    </div>

    <div class="wrap">
      <h1 class="page">Booking requests</h1>

      <div class="stats">
        <div class="stat accent"><div class="n" id="stat-new">0</div><div class="l">New</div></div>
        <div class="stat"><div class="n" id="stat-week">0</div><div class="l">This week</div></div>
        <div class="stat"><div class="n" id="stat-booked">0</div><div class="l">Booked</div></div>
        <div class="stat"><div class="n" id="stat-total">0</div><div class="l">Total</div></div>
      </div>

      <div class="toolbar">
        <button class="filter-chip active" data-status="all">All</button>
        <button class="filter-chip" data-status="new">New</button>
        <button class="filter-chip" data-status="contacted">Contacted</button>
        <button class="filter-chip" data-status="quoted">Quoted</button>
        <button class="filter-chip" data-status="booked">Booked</button>
        <button class="filter-chip" data-status="lost">Lost</button>
        <button class="filter-chip" data-status="archived">Archived</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Contact</th><th>Shoot</th><th>Package</th><th>Preferred date</th>
              <th>Received</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="leads-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-admin.js"></script>
</body>
</html>
