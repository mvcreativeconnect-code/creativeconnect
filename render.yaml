# Render Blueprint — deploys CreativeConnect as a full Node web service.
# On render.com: New → Blueprint → connect this repo → Apply.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: creativeconnect
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Signs admin login sessions. Render generates a strong random value.
      - key: JWT_SECRET
        generateValue: true
      # First admin account, created on first boot.
      - key: ADMIN_USERNAME
        value: admin
      # Set this yourself in the Render dashboard (Environment tab) — keep it secret.
      - key: ADMIN_PASSWORD
        sync: false
      # --- Email (Gmail SMTP): booking notification + customer auto-reply ---
      # These are not secret, so they live here.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: mvcreativeconnect@gmail.com
      - key: MAIL_FROM
        value: "CreativeConnect <mvcreativeconnect@gmail.com>"
      - key: MAIL_TO
        value: mvcreativeconnect@gmail.com
      # Gmail App Password (16 chars, no spaces). Set in the Render dashboard
      # (Environment tab) — NEVER commit it. Create one at:
      # Google Account → Security → 2-Step Verification → App passwords.
      - key: SMTP_PASS
        sync: false
    # NOTE: The free plan has an EPHEMERAL filesystem — the SQLite database and
    # uploaded images reset whenever the service restarts or redeploys (default
    # content re-seeds automatically). To keep data permanently, upgrade to a
    # paid instance and attach a Disk mounted at /data, then add:
    #   - key: DB_PATH
    #     value: /data/creativeconnect.db
    # disk:
    #   name: cc-data
    #   mountPath: /data
    #   sizeGB: 1
